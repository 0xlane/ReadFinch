name: Build and core tests
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: runner.os == 'Windows'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: assets/ocr/*.traineddata
          key: ${{ runner.os }}-ocr-${{ hashFiles('assets/ocr/manifest.json') }}
      - run: npm run assets:ocr
      - run: npm run build
      - name: Exercise the macOS selection toolbar
        if: runner.os == 'macOS'
        run: node scripts/toolbar-smoke.mjs --verify-only
      - run: npm run test:ocr
      - uses: actions/upload-artifact@v4
        with:
          name: built-${{ matrix.os }}
          path: |
            dist
            native/bin
            docs/offline-ocr-verification.json
