name: Publish release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Retry publication using successful package jobs from this run (optional)"
        type: string
        required: false
      release_tag:
        description: "Existing tag corresponding to that run, e.g. v1.0.0"
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: inputs.build_run_id == ''
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            command: --win nsis portable --x64
          - os: macos-15
            platform: macos
            arch: arm64
            command: --mac dmg zip --arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
            command: --mac dmg zip --x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            command: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: runner.os == 'Windows'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: assets/ocr/*.traineddata
          key: ${{ runner.os }}-ocr-${{ hashFiles('assets/ocr/manifest.json') }}
      - run: npm run assets:ocr
      - run: npm run build
      - run: npm run test:ocr
      - name: Build platform packages
        env:
          READFINCH_MACOS_SIGNING_P12: ${{ runner.os == 'macOS' && secrets.READFINCH_MACOS_SIGNING_P12 || '' }}
          READFINCH_MACOS_SIGNING_PASSWORD: ${{ runner.os == 'macOS' && secrets.READFINCH_MACOS_SIGNING_PASSWORD || '' }}
        run: npx electron-builder ${{ matrix.command }} --publish never
      - name: Verify fixed macOS signing identity and native signatures
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then app="release/mac-arm64/ReadFinch.app"; else app="release/mac/ReadFinch.app"; fi
          node scripts/verify-macos-signing.mjs "$app" --ci
      - name: Run the Windows packaged application and bundled OCR
        if: matrix.platform == 'windows'
        run: node scripts/packaged-smoke.mjs release/win-unpacked/ReadFinch.exe --isolated-shortcuts
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  publish:
    name: Verify, sign and publish
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.build_run_id != '') && (needs.package.result == 'success' || inputs.build_run_id != '') }}
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the release tag and artifact source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: node scripts/verify-release-source.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id || github.run_id }}
      - name: Verify complete packages and sign the update manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: node --import tsx scripts/publish-manifest.mjs release-assets
      - name: Publish complete stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --title "ReadFinch ${tag#v} · 伴读雀" --notes-file "docs/releases/$tag.md"
          fi
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
          if [ "$draft" != "true" ]; then
            echo "This version is already published. Create a new version instead of replacing installed update assets."
            exit 1
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --latest
